server {
    listen 443 ssl http2;
    server_name images.gokez.com;

    ssl_certificate     /etc/letsencrypt/live/images.gokez.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/images.gokez.com/privkey.pem;

    root /opt/gokez-mart;
    autoindex off;

    location / {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # Only storage API is proxied; files are served directly by nginx.
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 6m;
    }
}
