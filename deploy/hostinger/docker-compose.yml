services:
  api:
    build:
      context: ../..
      dockerfile: deploy/hostinger/Dockerfile
    image: gokez-mart-api:latest
    container_name: gokez-mart-api
    restart: unless-stopped
    stop_grace_period: 15s
    env_file: /opt/gokez-mart-backend/.env
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - storage
      - postgres
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Resource limits are intentionally left unset until VPS capacity is verified.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

networks:
  storage:
    external: true
    name: storage-service_default
  postgres:
    external: true
    name: postgres_default
