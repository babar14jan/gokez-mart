services:
  api:
    build:
      context: ../..
      dockerfile: deploy/hostinger/Dockerfile
    image: gokez-mart-api:latest
    container_name: gokez-mart-api
    restart: unless-stopped
    stop_grace_period: 15s
    env_file: /opt/gokez-mart-backend/.env
    ports:
      - "127.0.0.1:3000:3000"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Resource limits are intentionally left unset until VPS capacity is verified.
    # Example (uncomment after measuring actual usage):
    # deploy:
    #   resources:
    #     limits:
    #       cpus: "1.0"
    #       memory: 1G
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
