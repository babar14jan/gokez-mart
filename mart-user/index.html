<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/icon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180.png" />
    <link rel="manifest" href="/manifest.json" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f0fdf4" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Gokez Mart" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Google Search Console Verification -->
    <meta name="google-site-verification" content="dLZncxjl6u3SsqYnWF8tX9bqGkso5LTe1B9G0FHSJC4" />

    <!-- Primary SEO -->
    <title>Gokez Mart | Shop local. Support local.</title>
    <meta name="description" content="Shop local, support local. Order fresh groceries from your neighbourhood stores in Kolkata, delivered fast to your door." />
    <meta name="keywords" content="Gokez, Gokez Mart, shop local, support local, grocery delivery Kolkata, local stores Kolkata, hyperlocal delivery Kolkata, neighbourhood delivery" />
    <meta name="robots" content="index,follow" />
    <link rel="canonical" href="https://mart.gokez.com/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Gokez Mart" />
    <meta property="og:title" content="Gokez Mart | Shop local. Support local." />
    <meta property="og:description" content="Shop local, support local. Order fresh groceries from your neighbourhood stores in Kolkata, delivered fast to your door." />
    <meta property="og:url" content="https://mart.gokez.com/" />
    <meta property="og:image" content="https://mart.gokez.com/mart_logo_new.png" />
    <meta property="og:locale" content="en_IN" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Gokez Mart | Shop local. Support local." />
    <meta name="twitter:description" content="Shop local, support local. Order fresh groceries from your neighbourhood stores in Kolkata, delivered fast." />
    <meta name="twitter:image" content="https://mart.gokez.com/mart_logo_new.png" />

    <!-- Structured Data: LocalBusiness -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "GroceryStore",
      "name": "Gokez Mart",
      "alternateName": "Gokez",
      "url": "https://mart.gokez.com",
      "logo": "https://mart.gokez.com/mart_logo_new.png",
      "image": "https://mart.gokez.com/mart_logo_new.png",
      "description": "Gokez Mart — shop local, support local. A hyperlocal marketplace bringing neighbourhood stores online so they can deliver to their community fast.",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Kolkata",
        "addressRegion": "West Bengal",
        "addressCountry": "IN"
      },
      "areaServed": "Kolkata",
      "priceRange": "₹",
      "servesCuisine": "Groceries",
      "hasOfferCatalog": {
        "@type": "OfferCatalog",
        "name": "Fresh Groceries"
      },
      "sameAs": [
        "https://gokez.com"
      ]
    }
    </script>

    <!-- Structured Data: WebSite (enables sitelinks search) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Gokez Mart",
      "alternateName": "Gokez",
      "url": "https://mart.gokez.com"
    }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap"
      onload="this.onload=null;this.rel='stylesheet'" />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
