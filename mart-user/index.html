<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Favicons. All generated from the single canonical source
         public/mart_logo_new.png (see the note in favicon.ico generation).
         /favicon.ico is listed first and is a real multi-size 16/32/48 ICO, so
         the conventional browser request for /favicon.ico returns an image
         instead of falling through to the SPA shell. -->
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preload" as="image" href="/mart_brand_new.webp" type="image/webp" />

    <!-- interactive-widget=resizes-content: on Android the keyboard shrinks the
         LAYOUT viewport instead of only the visual one, so focused fields stay
         reachable without the whole page reflowing under the customer. The
         default (resizes-visual) is what makes a form look like it is shaking as
         the browser scrolls a fixed-height page around the caret. iOS Safari
         ignores this directive, which is why --kb exists as well. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Gokez Mart" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Google Search Console Verification -->
    <meta name="google-site-verification" content="dLZncxjl6u3SsqYnWF8tX9bqGkso5LTe1B9G0FHSJC4" />

    <!-- Primary SEO -->
    <!-- Brand: "Gokez Mart" (all caps MART) with the slogan "Shop Local. Support Local."
         is the single public SEO identity for this site. gokez.com is the parent
         company and is referenced, never substituted for, this site's identity.
         Keep in sync with: public/sitemap.xml, public/manifest.json, title below. -->
    <title>Gokez Mart – Shop Local. Support Local.</title>
    <meta name="description" content="Gokez Mart is an online marketplace for ordering everyday essentials from nearby stores." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://mart.gokez.com/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Gokez Mart" />
    <meta property="og:title" content="Gokez Mart – Shop Local. Support Local." />
    <meta property="og:description" content="Gokez Mart is an online marketplace for ordering everyday essentials from nearby stores." />
    <meta property="og:url" content="https://mart.gokez.com/" />
    <!-- Social card: 1000x1000 JPEG recompressed from mart_logo_new.png (679 KB -> 62 KB).
         The logo artwork itself is untouched. JPEG is used because WebP is not
         reliably supported by social scrapers. -->
    <meta property="og:image" content="https://mart.gokez.com/mart_og.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1000" />
    <meta property="og:image:height" content="1000" />
    <meta property="og:image:alt" content="Gokez Mart" />
    <meta property="og:locale" content="en_IN" />

    <!-- Twitter/X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Gokez Mart – Shop Local. Support Local." />
    <meta name="twitter:description" content="Gokez Mart is an online marketplace for ordering everyday essentials from nearby stores." />
    <meta name="twitter:image" content="https://mart.gokez.com/mart_og.jpg" />
    <meta name="twitter:image:alt" content="Gokez Mart" />

        <!-- Gokez Mart is a commerce platform, not a claim about a single physical
          shop. This graph contains only verified parent-company and product data. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://gokez.com/#organization",
          "name": "Gokez Technologies Pvt. Ltd.",
          "legalName": "Gokez Technologies Pvt. Ltd.",
          "url": "https://gokez.com/",
          "description": "Gokez Technologies builds focused technology products for everyday life in India.",
          "sameAs": [
            "https://instagram.com/gokez.app",
            "https://linkedin.com/company/gokez"
          ]
        },
        {
          "@type": "OnlineStore",
          "@id": "https://mart.gokez.com/#organization",
          "name": "Gokez Mart",
          "alternateName": ["Gokez Mart", "Gokezmart"],
          "url": "https://mart.gokez.com/",
          "logo": "https://mart.gokez.com/mart_logo_new.png",
          "description": "Gokez Mart is an online marketplace for ordering everyday essentials from nearby stores.",
          "parentOrganization": { "@id": "https://gokez.com/#organization" },
          "brand": {
            "@type": "Brand",
            "@id": "https://mart.gokez.com/#brand",
            "name": "Gokez Mart"
          }
        },
        {
          "@type": "WebSite",
          "@id": "https://mart.gokez.com/#website",
          "name": "Gokez Mart",
          "alternateName": ["Gokez Mart", "Gokezmart"],
          "url": "https://mart.gokez.com/",
          "inLanguage": "en-IN",
          "publisher": { "@id": "https://mart.gokez.com/#organization" }
        },
        {
          "@type": "WebApplication",
          "@id": "https://mart.gokez.com/#application",
          "name": "Gokez Mart",
          "url": "https://mart.gokez.com/",
          "description": "Gokez Mart is an online marketplace for ordering everyday essentials from nearby stores.",
          "applicationCategory": "ShoppingApplication",
          "operatingSystem": "Any",
          "browserRequirements": "Requires JavaScript",
          "inLanguage": "en-IN",
          "publisher": { "@id": "https://mart.gokez.com/#organization" },
          "parentOrganization": { "@id": "https://gokez.com/#organization" }
        },
        {
          "@type": "WebPage",
          "@id": "https://mart.gokez.com/#webpage",
          "name": "Gokez Mart – Shop Local. Support Local.",
          "url": "https://mart.gokez.com/",
          "description": "Gokez Mart is an online marketplace for ordering everyday essentials from nearby stores.",
          "isPartOf": { "@id": "https://mart.gokez.com/#website" },
          "about": { "@id": "https://mart.gokez.com/#organization" }
        }
      ]
    }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap"
      onload="this.onload=null;this.rel='stylesheet'" />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" />
    </noscript>
    <!-- Runs in <head>, before first paint, so the static block below is hidden
         before it can flash for users who have JavaScript enabled. -->
    <script>document.documentElement.classList.add('js');</script>
    <style>
      /* Styling for the no-JavaScript SEO block only. Nothing here affects the
         React app, which renders its own layout into #root. */
      .seo-static { max-width: 42rem; margin: 0 auto; padding: 2.5rem 1.25rem; font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif; color: #0f172a; }
      .seo-static h1 { font-family: Poppins, Inter, system-ui, sans-serif; font-size: 1.75rem; line-height: 1.2; font-weight: 700; margin: 0 0 0.75rem; }
      .seo-static p { font-size: 1rem; line-height: 1.6; margin: 0 0 0.75rem; color: #334155; }
      .seo-static a { color: #059669; }
      .seo-static nav { margin-top: 1.25rem; font-size: 0.875rem; display: flex; gap: 1rem; flex-wrap: wrap; }
      .js .seo-static { display: none; }
    </style>
  </head>
  <body>
    <!-- Static crawlable content for crawlers that do not execute JavaScript.
         It carries the site identity (h1), the one-line explanation of what
         Gokez Mart is, and the parent-company link. The React app takes over
         immediately: the .js class above hides this block before first paint, and
         src/main.tsx removes it from the DOM before the app renders, so a rendered
         page never contains this text or a second h1. -->
    <div class="seo-static" id="seo-static">
      <h1>Gokez Mart</h1>
      <p>Shop Local. Support Local.</p>
      <p>Gokez Mart is an online marketplace for ordering everyday essentials from nearby stores.</p>
      <nav>
        <a href="/about">About Gokez Mart</a>
        <a href="/privacy">Privacy Policy</a>
        <a href="/terms">Terms of Service</a>
        <a href="/grievance">Grievance Redressal</a>
        <a href="/feedback">Feedback</a>
      </nav>
      <p>Gokez Mart is a product of <a href="https://gokez.com/" rel="noopener">Gokez Technologies</a>.</p>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
