name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'mart-user/**'
  workflow_dispatch:  # allow manual trigger from GitHub UI

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build --workspace=mart-user
        env:
          VITE_API_URL: https://mart-api-qzml.onrender.com/api/v1

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Sync Capacitor
        working-directory: mart-user
        run: npx cap sync android

      - name: Make gradlew executable
        working-directory: mart-user/android
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: mart-user/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gokez-mart-debug-${{ github.run_number }}
          path: mart-user/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Comment APK download on commit
        if: github.event_name == 'push'
        run: |
          echo "✅ APK built successfully!"
          echo "Download from: Actions → Build Android APK → Artifacts"
