name: Build Hub Android APK

on:
  push:
    branches: [main]
    paths:
      - 'mart-hub/**'
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build --workspace=mart-hub
        env:
          VITE_API_URL: https://mart-api-qzml.onrender.com/api/v1

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Sync Capacitor
        working-directory: mart-hub
        run: npx cap sync android

      - name: Make gradlew executable
        working-directory: mart-hub/android
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: mart-hub/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gokez-hub-debug-${{ github.run_number }}
          path: mart-hub/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
