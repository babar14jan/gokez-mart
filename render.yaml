# Render blueprint for the Gokez Mart API.
#
# This is the primary deployment for mart-backend, and it is additive: the
# Railway configuration is untouched, so the same repository can be deployed
# to either platform.
#
# The build has to run from the repository root. This is a monorepo: the
# npm workspaces install hoists every package's dependencies into the root
# node_modules, and a build that ran from mart-backend/ alone would not find
# them. `rootDir` therefore stays at the repository root.
#
# Environment variables marked `sync: false` are declared here but not stored
# here. Render prompts for them on creation, and they are then managed in the
# dashboard (Service -> Environment). Every secret stays out of git. The
# values to enter are the same ones the Railway service already has.
#
# A note on the free plan: Render stops a free web service after it has been
# idle for a while and starts it again on the next request. That first request
# after a pause waits for the service to boot, database migrations included,
# so a customer can see the storefront's offline notice for those seconds
# before it comes back. If the store needs to answer instantly at every hour
# of the day, move the service to a paid instance type.

services:
  - type: web
    name: mart-api-qzml
    runtime: node
    plan: free
    # Singapore is the closest region to Kolkata. The region cannot be changed
    # after the service is created.
    region: singapore
    branch: main
    autoDeployTrigger: commit
    rootDir: .
    # The full build is verified here: the compiled entrypoint and the copied
    # migrations must both be present, or the deploy fails loudly rather than
    # shipping an image that cannot start.
    buildCommand: npm ci && npm run build --workspace=mart-backend && ls -la mart-backend/dist/index.js && ls mart-backend/dist/database/migrations | wc -l
    # Compiles if the output is missing, otherwise runs the compiled build.
    startCommand: npm run start --workspace=mart-backend
    healthCheckPath: /api/v1/health
    # How long Render waits between SIGTERM and SIGKILL. The API's own drain
    # budget is 8 seconds (utils/shutdown.ts), which has to fit inside this.
    maxShutdownDelaySeconds: 30
    envVars:
      - key: NODE_ENV
        value: production
      # The database the API runs against. A connection string; never commit it.
      - key: DATABASE_URL
        sync: false
      # Signs admin and customer sessions. At least 32 characters, unique to
      # this deployment. The API refuses to boot in production without it.
      - key: MART_JWT_SECRET
        sync: false
      # The web origins allowed to call the API, comma separated, each one
      # HTTPS. The API refuses to boot in production without at least one, and
      # refuses any entry that is not https://. These are the origins the page
      # is served from -- the web apps -- not the API's own address.
      # Example: https://mart.gokez.com,https://hub.gokez.com
      - key: MART_CORS_ORIGIN
        sync: false
      # Image uploads.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: mart-products
      # Push notifications. Optional: without these the API serves everything
      # else and simply cannot send web push.
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      # Sends customer login OTPs by SMS. Required in production: without it
      # every customer sign-in fails with "SMS service not configured".
      - key: TWO_FACTOR_API_KEY
        sync: false
      # Error reporting. Optional: without it, Sentry is disabled.
      - key: SENTRY_DSN
        sync: false
