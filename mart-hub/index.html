<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/icon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preload" as="image" href="/mart_hub_brand_logo.webp" type="image/webp" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Gokez Hub" />
    <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#18191a" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Gokez Hub | Bringing local stores online</title>
    <meta name="description" content="Gokez Hub — bringing local stores online. Manage orders, products, inventory and your team from one place." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      onload="this.onload=null;this.rel='stylesheet'" />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
    </noscript>
    <style>
      /* Paint the app background before CSS/JS arrive. An update swap reloads
         through the service worker, but the window between unload and first
         paint would otherwise flash white — which reads as the app "closing and
         reopening". Matching the theme here makes the reload read as a smooth
         transition instead. */
      html { background-color: #ffffff; }
      @media (prefers-color-scheme: dark) { html { background-color: #18191a; } }
      html.dark { background-color: #18191a; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Safety net for a stale cached shell: if the app module never boots
         (its entry chunk was replaced by a deploy while a cached index.html
         still points at the old one), drop the service worker and caches and
         reload once. This runs from the HTML itself, so it works even when the
         app's JavaScript never executes — the exact blank-screen-with-a-
         connection case. Skipped offline, where a reload could not help. -->
    <script>
      (function () {
        window.setTimeout(function () {
          if (window.__gokezBooted || !navigator.onLine) return;
          try {
            var last = Number(sessionStorage.getItem('gokez-recover-at') || 0);
            if (Date.now() - last < 60000) return;
            sessionStorage.setItem('gokez-recover-at', String(Date.now()));
          } catch (e) { return; }
          var jobs = [];
          try {
            jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) {
              return Promise.all(rs.map(function (r) { return r.unregister(); }));
            }));
          } catch (e) {}
          try {
            jobs.push(caches.keys().then(function (keys) {
              return Promise.all(keys.map(function (k) { return caches.delete(k); }));
            }));
          } catch (e) {}
          Promise.all(jobs).then(reload, reload);
          function reload() { window.location.reload(); }
        }, 9000);
      })();
    </script>
  </body>
</html>
